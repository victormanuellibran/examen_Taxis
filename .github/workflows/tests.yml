name: Tests

"on":
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Verificar dependencias
        run: python -m pip check

      - name: Ejecutar pytest
        run: python -m pytest -q

      - name: Validar proyecto dbt sin datasets reales
        env:
          NYC_TAXI_DATA_DIR: ${{ runner.temp }}/nyc-taxi-data
          NYC_TAXI_DBT_WAREHOUSE: ${{ runner.temp }}/nyc-taxi-ci.duckdb
          NYC_TAXI_DBT_TEMP: ${{ runner.temp }}/nyc-taxi-tmp
        run: |
          mkdir -p "$NYC_TAXI_DATA_DIR" "$NYC_TAXI_DBT_TEMP"
          python -m dbt.cli.main parse \
            --project-dir dbt_project \
            --profiles-dir dbt_project \
            --no-partial-parse
          python -m dbt.cli.main compile \
            --project-dir dbt_project \
            --profiles-dir dbt_project \
            --no-partial-parse \
            --vars '{"comparison_month":"2024-06","target_month":"2025-06","comparison_year":2024,"comparison_month_num":"06","target_year":2025,"target_month_num":"06"}'
