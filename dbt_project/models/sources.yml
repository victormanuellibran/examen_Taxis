version: 2

sources:
  - name: taxi_external
    description: "Archivos aceptados y catálogo TLC producidos por la ingesta Python."
    schema: external
    tables:
      - name: accepted_comparison
        description: "Viajes aceptados del período de comparación."
        meta:
          external_location: "read_parquet('{{ env_var('NYC_TAXI_DATA_DIR', 'data') }}/validated/yellow/year={{ var('comparison_year') }}/month={{ var('comparison_month_num') }}/accepted.parquet', hive_partitioning=false)"
      - name: accepted_target
        description: "Viajes aceptados del período asignado."
        meta:
          external_location: "read_parquet('{{ env_var('NYC_TAXI_DATA_DIR', 'data') }}/validated/yellow/year={{ var('target_year') }}/month={{ var('target_month_num') }}/accepted.parquet', hive_partitioning=false)"
      - name: curated_comparison
        description: "Capa curada del período de comparación generada por src.transform."
        meta:
          external_location: "read_parquet('{{ env_var('NYC_TAXI_DATA_DIR', 'data') }}/curated/yellow/year={{ var('comparison_year') }}/month={{ var('comparison_month_num') }}/part-000.parquet', hive_partitioning=false)"
      - name: curated_target
        description: "Capa curada del período asignado generada por src.transform."
        meta:
          external_location: "read_parquet('{{ env_var('NYC_TAXI_DATA_DIR', 'data') }}/curated/yellow/year={{ var('target_year') }}/month={{ var('target_month_num') }}/part-000.parquet', hive_partitioning=false)"
      - name: taxi_zone_lookup
        description: "Catálogo oficial de zonas TLC usado para integridad referencial."
        meta:
          external_location: "read_csv_auto('{{ env_var('NYC_TAXI_DATA_DIR', 'data') }}/reference/taxi_zone_lookup.csv')"
