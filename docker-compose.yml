services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: examen-nyc-taxi:latest
    container_name: nyc_taxi_pipeline
    working_dir: /app
    environment:
      NYC_TAXI_DATA_DIR: /app/data
      NYC_TAXI_DBT_WAREHOUSE: /app/data/warehouse/nyc_taxi_dbt.duckdb
      NYC_TAXI_DBT_TEMP: /app/data/tmp
      DBT_PROJECT_DIR: /app/dbt_project
      DBT_PROFILES_DIR: /app/dbt_project
      DBT_TARGET_PATH: /tmp/dbt_target
      DBT_LOG_PATH: /tmp/dbt_logs
      # Métricas en vivo para Prometheus/Grafana (perfil "monitoreo"). Sólo observan; no cambian resultados.
      NYC_TAXI_METRICS_PORT: "9108"
      NYC_TAXI_METRICS_ADDR: 0.0.0.0
    volumes:
      - ./data:/app/data
      - ./RESULTADOS.md:/app/RESULTADOS.md
    mem_limit: 4g
    cpus: 2.0
    restart: "no"
    command: ["python", "-m", "src.pipeline", "--mes", "2025-06"]

  # --- Monitoreo en tiempo real (opcional) -------------------------------------------
  # docker compose --profile monitoreo up -d prometheus grafana
  # Grafana: http://localhost:3001   Prometheus: http://localhost:9090
  prometheus:
    profiles: ["monitoreo"]
    image: prom/prometheus:v3.5.0
    container_name: nyc_taxi_prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    mem_limit: 512m

  grafana:
    profiles: ["monitoreo"]
    image: grafana/grafana:12.1.0
    container_name: nyc_taxi_grafana
    depends_on: [prometheus]
    environment:
      # Sólo para uso local: entra sin usuario ni contraseña.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/nyc_taxi_pipeline.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    mem_limit: 512m
